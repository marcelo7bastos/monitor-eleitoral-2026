name: Relógio da apuração

# Reserva do cron do GitHub, que pode atrasar ou não disparar: dispara a coleta
# a cada dez minutos até o fim da janela. Cada execução dura menos de 6 h e,
# ao terminar, inicia a próxima, até o horário informado em "fim".
on:
  workflow_dispatch:
    inputs:
      fim:
        description: Horário UTC em que o relógio para (ISO 8601)
        required: true
        default: '2026-10-26T09:00:00Z'
      eleicao:
        description: Eleição federal disparada a cada ciclo
        required: true
        default: '6258'
        type: choice
        options: ['6257', '6258']

permissions:
  actions: write
  contents: read

concurrency:
  group: relogio-apuracao
  cancel-in-progress: false

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FIM: ${{ inputs.fim }}
      ELEICAO: ${{ inputs.eleicao }}
    steps:
      - name: Disparar coleta a cada dez minutos
        shell: bash
        run: |
          set -euo pipefail
          fim=$(date -d "$FIM" +%s)
          limite=$(( $(date +%s) + 340 * 60 ))
          while :; do
            agora=$(date +%s)
            if [ "$agora" -ge "$fim" ]; then echo 'Fim da janela; relógio encerrado.'; exit 0; fi
            if [ "$agora" -ge "$limite" ]; then break; fi
            # Pula se houver execução ativa ou criada há menos de 8 min (cron, tarefa local ou manual).
            ocupado=$(gh run list --workflow monitor-manual.yml --limit 10 --json status,createdAt \
              --jq '[.[] | select(.status != "completed" or (now - (.createdAt | fromdateiso8601)) < 480)] | length') || ocupado=erro
            if [ "$ocupado" = 0 ]; then
              gh workflow run monitor-manual.yml --ref main -f eleicao="$ELEICAO" \
                && echo "Disparo enviado $(date -u +%FT%TZ)" \
                || echo "::warning::Falha ao disparar a coleta $(date -u +%FT%TZ)"
            else
              echo "Pulando $(date -u +%FT%TZ): execução ativa ou recente ($ocupado)"
            fi
            sleep 600
          done
          gh workflow run relogio.yml --ref main -f fim="$FIM" -f eleicao="$ELEICAO"
          echo 'Limite de duração atingido; próximo relógio iniciado.'
