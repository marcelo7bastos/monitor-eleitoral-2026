name: Monitor eleitoral - arquivo histórico
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: monitor-manual
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validar código e acervo
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_dashboard.cjs
      - name: Restaurar acervo preservado sem nova coleta
        run: python -m zipfile -e arquivo-final/monitor-estado.zip dados
      - name: Gerar publicação histórica
        run: python -m monitor.publicacao --pasta dados --destino dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
      - name: Publicar arquivo histórico
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
