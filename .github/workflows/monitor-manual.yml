name: Monitor eleitoral - coleta e Pages

on:
  workflow_dispatch:
    inputs:
      eleicao:
        description: Eleição federal (6257 primeiro turno, 6258 segundo turno)
        required: true
        default: '6258'
        type: choice
        options: ['6257', '6258']

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: monitor-manual
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Testar cálculos e falhas controladas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencias
          python -m unittest discover -s tests -v 2>&1 | tee evidencias/testes_actions.txt
          python -m unittest discover -s scripts -p test_validacao_t1.py -v
          node --test tests/test_dashboard.cjs
      - name: Recuperar último estado e histórico
        id: recuperar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          previous=$(gh api "repos/$GH_REPO/actions/artifacts?name=monitor-estado&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$previous" ]; then
            gh run download "$previous" --name monitor-estado --dir dados
            printf 'Estado recuperado da execução %s\n' "$previous"
          else
            mkdir -p dados
            printf 'Primeira execução: sem histórico remoto anterior.\n'
          fi
          echo 'pronto=true' >> "$GITHUB_OUTPUT"
      - name: Coletar e calcular 28 abrangências
        id: coleta
        continue-on-error: true
        env:
          ELEICAO: ${{ inputs.eleicao || '6258' }}
        run: python -m monitor.pipeline --eleicao "$ELEICAO" --pasta dados
      - name: Gerar dashboard e histórico real
        id: site
        if: ${{ always() && steps.recuperar.outputs.pronto == 'true' }}
        run: python -m monitor.publicacao --pasta dados --destino dist
      - name: Resumo e avisos
        if: ${{ always() && steps.recuperar.outputs.pronto == 'true' }}
        env:
          ELEICAO: ${{ inputs.eleicao || '6258' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('dados') / ('estado_conjunto_' + os.environ['ELEICAO'] + '.json')
          if p.exists():
              d=json.loads(p.read_text())
              texto=f"## Monitor eleitoral\n\nAceitas: {d['aceitas_nesta_tentativa']}/28.\n\nDesatualizado: {d['desatualizado']}.\n\n{d['aviso']}\n\nÚltima coleta válida: {d['ultima_coleta_valida_utc']}.\n\nConsolidação: {d['consolidacao']}.\n"
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(texto)
              if d['desatualizado']: print('::warning::' + d['aviso'])
          PY
      - name: Preservar dados e logs inclusive em falha
        if: ${{ always() && steps.recuperar.outputs.pronto == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitor-estado
          path: dados/
          retention-days: 90
          if-no-files-found: error
      - name: Guardar evidências dos testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitor-testes
          path: evidencias/testes_actions.txt
          retention-days: 90

      - name: Configurar Pages
        if: ${{ success() && steps.site.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Empacotar publicação validada
        if: ${{ success() && steps.site.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        if: ${{ success() && steps.site.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Sinalizar falha de coleta após preservar e publicar o aviso
        if: ${{ always() && steps.coleta.outcome == 'failure' }}
        run: exit 1
